<!DOCTYPE html>
<html>
<head>  
<title>Pet Gallery</title>

<link rel="stylesheet" href="demo.css">

</head> 	
<body>

<div id="container">

<header>Paws &amp; Whiskers Pet Care</header>
<nav>
	<ul>
    <li><a href="js-demo2.html">Home</a></li>
    <li><a href="js-demo2b.html">About</a></li>
    <li><a href="js-demo2d.html">Gallery</a></li>
    <li><a href="js-demo2c.html">Contact</a></li>
	</ul>
</nav>

<main>
  <h1>Our Pet Gallery</h1>
  <p>Discover the animals that make every day brighter.</p>

  <div id="petInfo" class="pet-info">
    <h2 id="petName"></h2>
    <p id="petDetails"></p>
    <a href="#" id="closePetInfo">Click This To Close</a>
  </div>

  <ul id="gallery"></ul>
</main>

<footer>&copy; Copyright 2020</footer>

</div>

<script>
  var imageFiles = [
    "pet1.jpg",
    "pet2.jpg",
    "pet3.jpg",
    "pet4.jpg",
    "pet5.jpg"
  ];

  var captionTexts = [
    "Buddy - Friendly Dog Looking for a Forever Home",
    "Max - Playful Dog Ready for Adoption",
    "Luna - Loving Cat Searching for a Family",
    "Milo - Friendly Cat Waiting for Adoption",
    "Nemo - Beautiful Fish Ready for a New Aquarium Home"
  ];

  var descTexts = [
    "A friendly dog available for adoption and ready for a loving home",
    "A playful dog eager to meet a new family",
    "A loving cat searching for a warm forever home",
    "A friendly cat waiting to be adopted into a caring family",
    "A beautiful fish ready for a new aquarium home"
  ];

  var infoTexts = [
    "Buddy is a friendly 2-year-old Labrador who enjoys playing with children and needs a caring family.",
    "Max is a playful puppy who loves walks and would be perfect for an active home.",
    "Luna is a gentle cat who loves attention and would thrive in a quiet home.",
    "Milo is a friendly cat who enjoys lounging and would be a wonderful companion for a patient family.",
    "Nemo is a bright and colorful fish who would be happy in a well-maintained aquarium home."
  ];

  var openCaptionTag = "<div class='caption'>";
  var closeCaptionTag = "</div>";
  var openDescTag = "<div class='description'>";
  var closeDescTag = "</div>";

  var gallery = document.getElementById("gallery");
  var html = "";

  for (var i = 0; i < imageFiles.length; i++) {
    html += "<li id='photo" + (i + 1) + "' data-index='" + i + "'>";
    html += "<img src='images/" + imageFiles[i] + "'>";
    html += openCaptionTag + captionTexts[i] + closeCaptionTag;
    html += openDescTag + descTexts[i] + closeDescTag;
    html += "</li>";
  }

  gallery.innerHTML = html;

  var petInfoBox = document.getElementById("petInfo");
  var petName = document.getElementById("petName");
  var petDetails = document.getElementById("petDetails");
  var closePetInfo = document.getElementById("closePetInfo");
  var petItems = document.querySelectorAll("#gallery li");

  for (var j = 0; j < petItems.length; j++) {
    petItems[j].addEventListener("click", function () {
      var index = parseInt(this.getAttribute("data-index"), 10);
      var name = captionTexts[index].split(" - ")[0];
      petName.textContent = name;
      petDetails.textContent = infoTexts[index];
      petInfoBox.style.display = "block";
    });
  }

  closePetInfo.addEventListener("click", function (event) {
    event.preventDefault();
    petInfoBox.style.display = "none";
  });
</script>

</body>
</html>
