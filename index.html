<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Gallery</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f7f7f7;
        color: #222;
      }
      h1 {
        text-align: center;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1.5rem;
        max-width: 1000px;
        margin: 2rem auto;
      }
      .gallery-item {
        position: relative;
        background: white;
        padding: 1rem;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        text-align: center;
      }
      .gallery-item img {
        display: block;
        width: 220px;
        height: 140px;
        object-fit: cover;
        border-radius: 8px;
        cursor: pointer;
      }
      .caption {
        margin-top: 0.75rem;
        font-weight: bold;
        color: #333;
      }
      .description {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        right: 1rem;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 0.6rem;
        border-radius: 6px;
        font-size: 0.9rem;
        visibility: hidden;
        pointer-events: none;
      }
      .gallery-item:hover .description {
        visibility: visible;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Pet Gallery</h1>
    <ul id="gallery" class="gallery"></ul>

    <script>
      var imageFiles = [
        "photo1.svg",
        "photo2.svg",
        "photo3.svg",
        "photo4.svg",
        "photo5.svg",
        "photo6.svg",
        "photo7.svg",
        "photo8.svg",
        "photo9.svg",
        "photo10.svg"
      ];

      var captionTexts = [
        "Sunny Meadow View",
        "Golden Sunset Horizon",
        "Forest Path Escape",
        "Cloudy Sky Glow",
        "Riverbend Calm",
        "Rustic Cabin Scene",
        "Mountain Morning Light",
        "Coastal Breeze",
        "Green Valley Retreat",
        "Warm Evening Glow"
      ];

      var descTexts = [
        "A peaceful meadow under bright daylight.",
        "A warm sunset stretching across the horizon.",
        "A quiet forest path surrounded by tall trees.",
        "Soft clouds floating over a calm sky.",
        "A relaxed river scene with gentle movement.",
        "A cozy cabin tucked into nature.",
        "The first light of morning over the hills.",
        "An airy coastal view with a cool breeze.",
        "A lush valley full of fresh green scenery.",
        "A glowing evening atmosphere that feels serene."
      ];

      var openCaptionTag = '<div class="caption">';
      var closeCaptionTag = '</div>';
      var openDescTag = '<div class="description">';
      var closeDescTag = '</div>';

      var gallery = document.getElementById('gallery');
      var html = '';

      for (var i = 0; i < imageFiles.length; i++) {
        html += '<li id="photo' + (i + 1) + '" class="gallery-item">';
        html += '<img src="images/' + imageFiles[i] + '" alt="Gallery image ' + (i + 1) + '">';
        html += openCaptionTag + captionTexts[i] + closeCaptionTag;
        html += openDescTag + descTexts[i] + closeDescTag;
        html += '</li>';
      }

      gallery.innerHTML = html;
    </script>
  </body>
</html>
